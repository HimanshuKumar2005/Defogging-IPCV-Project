project:
  name: "Image Dehazing: Classical Image Processing vs Deep Learning"
  device: "auto"

paths:
  checkpoint: "checkpoints/aodnet.pth"
  output_dir: "outputs"
  evaluation_dir: "data/evaluation"

dcp:
  patch_size: 15
  omega: 0.90
  t_min: 0.12
  atmospheric_percentile: 0.001
  guided_radius: 20
  guided_epsilon: 0.005

aodnet:
  enabled: true
  strict_checkpoint: false
